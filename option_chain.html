<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSE Option Chain Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        .call-columns {
            background-color: #ffeeee;
        }
        .put-columns {
            background-color: #eeeeff;
        }
        .strikePrice {
            background-color: #f9f9f9;
            font-weight: bold;
            text-align: center;
        }
        .totalRow {
            font-weight: bold;
            background-color: #e9e9e9;
        }
        .pcr {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 5px;
        }
        .bullish {
            color: green;
        }
        .bearish {
            color: red;
        }
        .neutral {
            color: #555;
        }
        .timestamp {
            text-align: right;
            margin-bottom: 10px;
            color: #777;
        }
        .refresh-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            float: right;
        }
        .refresh-btn:hover {
            background-color: #45a049;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .message {
            text-align: center;
            color: #666;
            margin: 20px 0;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="timestamp">Last Updated: <span id="timestamp">Never</span></div>
        <button class="refresh-btn" onclick="fetchData()">Refresh Data</button>
        <h1>NSE Option Chain Data</h1>
        
        <div class="pcr" id="pcrValue">Put-Call Ratio (PCR): Not Available</div>
        
        <div class="loader" id="loader"></div>
        <div class="message" id="message">Waiting for data...</div>
        
        <table id="optionChainTable">
            <thead>
                <tr>
                    <th colspan="4" class="call-columns">CALLS</th>
                    <th class="strikePrice">Strike Price</th>
                    <th colspan="4" class="put-columns">PUTS</th>
                </tr>
                <tr>
                    <th class="call-columns">OI</th>
                    <th class="call-columns">Change in OI</th>
                    <th class="call-columns">Volume</th>
                    <th class="call-columns">IV</th>
                    <th class="strikePrice"></th>
                    <th class="put-columns">IV</th>
                    <th class="put-columns">Volume</th>
                    <th class="put-columns">Change in OI</th>
                    <th class="put-columns">OI</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>

    <script>
        // Function to fetch data from the server
        async function fetchData() {
            try {
                // Show loading state
                document.getElementById('loader').style.display = 'block';
                document.getElementById('message').style.display = 'block';
                document.getElementById('message').textContent = 'Fetching data...';
                
                // In production, replace with your actual data endpoint
                const response = await fetch('/api/option-chain-data');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                loadData(data);
                
                // Hide loading state
                document.getElementById('loader').style.display = 'none';
                document.getElementById('message').style.display = 'none';
                
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('message').textContent = 'Error loading data. Please try again.';
                document.getElementById('loader').style.display = 'none';
            }
        }

        // Function to load data to the table
        function loadData(data) {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            // Generate list of strike prices by analyzing the data
            const strikePrices = [];
            
            // Loop through all data rows except the last one (total row)
            for (let i = 0; i < data.length - 1; i++) {
                const row = document.createElement('tr');
                
                // CALL columns (first 4 columns)
                for (let j = 0; j < 4; j++) {
                    const cell = document.createElement('td');
                    cell.className = 'call-columns';
                    cell.textContent = data[i][j];
                    row.appendChild(cell);
                }
                
                // Strike Price - we'll derive it based on row index
                // In your actual implementation, you might need to adjust this logic
                const strikeCell = document.createElement('td');
                strikeCell.className = 'strikePrice';
                
                // Calculate strike price (this is just an example - adjust based on your data structure)
                // For example, if you have 19 rows centered around 22000 with 50-point intervals
                const baseStrike = 22000 - ((data.length - 2) / 2) * 50;
                const strikePrice = baseStrike + (i * 50);
                
                strikeCell.textContent = strikePrice;
                row.appendChild(strikeCell);
                
                // PUT columns (last 4 columns)
                for (let j = 4; j < 8; j++) {
                    const cell = document.createElement('td');
                    cell.className = 'put-columns';
                    cell.textContent = data[i][j];
                    row.appendChild(cell);
                }
                
                tableBody.appendChild(row);
            }
            
            // Add total row
            const totalRow = document.createElement('tr');
            totalRow.className = 'totalRow';
            
            const lastRowIndex = data.length - 1;
            
            // Call OI Total
            const totalCallOI = document.createElement('td');
            totalCallOI.className = 'call-columns';
            totalCallOI.textContent = data[lastRowIndex][0];
            totalRow.appendChild(totalCallOI);
            
            // Empty Call Change OI
            const emptyCallChangeOI = document.createElement('td');
            emptyCallChangeOI.className = 'call-columns';
            totalRow.appendChild(emptyCallChangeOI);
            
            // Call Volume Total
            const totalCallVolume = document.createElement('td');
            totalCallVolume.className = 'call-columns';
            totalCallVolume.textContent = data[lastRowIndex][2];
            totalRow.appendChild(totalCallVolume);
            
            // Empty Call IV
            const emptyCallIV = document.createElement('td');
            emptyCallIV.className = 'call-columns';
            totalRow.appendChild(emptyCallIV);
            
            // Total Label
            const totalText = document.createElement('td');
            totalText.className = 'strikePrice';
            totalText.textContent = 'TOTAL';
            totalRow.appendChild(totalText);
            
            // Empty Put IV
            const emptyPutIV = document.createElement('td');
            emptyPutIV.className = 'put-columns';
            totalRow.appendChild(emptyPutIV);
            
            // Put Volume Total
            const totalPutVolume = document.createElement('td');
            totalPutVolume.className = 'put-columns';
            totalPutVolume.textContent = data[lastRowIndex][5];
            totalRow.appendChild(totalPutVolume);
            
            // Empty Put Change OI
            const emptyPutChangeOI = document.createElement('td');
            emptyPutChangeOI.className = 'put-columns';
            totalRow.appendChild(emptyPutChangeOI);
            
            // Put OI Total
            const totalPutOI = document.createElement('td');
            totalPutOI.className = 'put-columns';
            totalPutOI.textContent = data[lastRowIndex][7];
            totalRow.appendChild(totalPutOI);
            
            tableBody.appendChild(totalRow);
            
            // Calculate PCR (Put-Call Ratio)
            calculatePCR(data[lastRowIndex]);
            
            // Update timestamp
            document.getElementById('timestamp').textContent = new Date().toLocaleString();
        }
        
        function calculatePCR(totalsRow) {
            const pcrElement = document.getElementById('pcrValue');
            
            // Extract call OI and put OI totals and convert to numbers
            const callOI = parseInt(totalsRow[0].replace(/,/g, ''));
            const putOI = parseInt(totalsRow[7].replace(/,/g, ''));
            
            if (callOI && putOI) {
                const pcr = (putOI / callOI).toFixed(2);
                let status = '';
                let statusClass = '';
                
                if (pcr > 1.2) {
                    status = 'BULLISH';
                    statusClass = 'bullish';
                } else if (pcr < 0.8) {
                    status = 'BEARISH';
                    statusClass = 'bearish';
                } else {
                    status = 'NEUTRAL';
                    statusClass = 'neutral';
                }
                
                pcrElement.innerHTML = `Put-Call Ratio (PCR): ${pcr} <span class="${statusClass}">(${status})</span>`;
                pcrElement.className = `pcr ${statusClass}`;
            } else {
                pcrElement.textContent = 'Put-Call Ratio (PCR): Not Available';
            }
        }
        
        // Initialize by fetching data when the page loads
        window.onload = function() {
            // Uncomment this to automatically fetch data on page load
            // fetchData();
            
            document.getElementById('message').style.display = 'block';
            document.getElementById('message').textContent = 'Click "Refresh Data" to load the latest option chain data';
        };
    </script>
</body>
</html>
